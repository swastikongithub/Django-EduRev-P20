# FoodLoop checks: runs only when something under foodloop/ changes.
name: FoodLoop CI

on:
  push:
    paths: ["foodloop/**", ".github/workflows/foodloop-ci.yml"]
  pull_request:
    paths: ["foodloop/**", ".github/workflows/foodloop-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodloop/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodloop
          POSTGRES_PASSWORD: foodloop
          POSTGRES_DB: foodloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodloop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://foodloop:foodloop@localhost:5432/foodloop_test
      TEST_DATABASE_URL: postgresql://foodloop:foodloop@localhost:5432/foodloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foodloop/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (real PostgreSQL, includes the concurrency proof)
        run: pytest -q
      - name: Migrations match the models
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodloop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foodloop/frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
