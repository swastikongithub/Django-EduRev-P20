name: CI

# Every gate runs on pushes to main, on pull requests into main, and on demand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or branch); a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  # Shared by the jobs that run Django against the PostgreSQL container.
  DATABASE_URL: postgres://edurev:edurev@localhost:5432/edurev
  DJANGO_SECRET_KEY: ci-only-dummy-key-not-a-secret-0123456789
  DEBUG: "0"
  DEMO_MODE: "0"
  CELERY_TASK_ALWAYS_EAGER: "1"
  REDIS_URL: ""

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (version pinned by requirements-dev.txt range)
        run: pip install "$(grep -E '^ruff' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  tests:
    name: Django checks + tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONCURRENCY_ATTEMPTS: "500"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-django
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          max-connections: "700" # 500 simultaneous booking attempts, each on its own connection
      - name: Django system check
        run: python manage.py check --fail-level WARNING
      - name: Deployment check (production-like settings)
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
          ALLOWED_HOSTS=reserve.example.edu SECURE_SSL_REDIRECT=1 SITE_URL=https://reserve.example.edu \
          REDIS_URL=redis://localhost:6379/0 USE_S3=1 S3_BUCKET=ci-media \
          EMAIL_BACKEND=anymail.backends.resend.EmailBackend RESEND_API_KEY=ci-dummy \
          python manage.py check --deploy --fail-level WARNING
      - name: Deployment check refuses ephemeral media and undelivered mail
        run: |
          if DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
             ALLOWED_HOSTS=reserve.example.edu python manage.py check --deploy --fail-level ERROR; then
            echo "::error::check --deploy accepted a production configuration with no bucket and console email"
            exit 1
          fi
      - name: Migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Collect static (manifest storage, as in production)
        run: python manage.py collectstatic --noinput
      - name: OpenAPI specification is up to date
        run: |
          python manage.py spectacular --file "$RUNNER_TEMP/openapi.yaml" --validate --fail-on-warn
          diff -u docs/openapi.yaml "$RUNNER_TEMP/openapi.yaml" || {
            echo "::error::docs/openapi.yaml is out of date. Run: make openapi"; exit 1; }
      - name: pytest (unit, integration, API, security, concurrency, docs)
        run: >
          pytest -m "not e2e" -q
          --cov=apps --cov-report=xml --cov-report=term --cov-fail-under=75
          --junitxml=reports/junit-tests.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Browser journeys + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-django
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Chromium (matching the installed Playwright)
        run: python -m playwright install --with-deps chromium
      - name: pytest -m e2e (WCAG 2.2 AA via axe-core in light and dark themes)
        run: >
          pytest -m e2e -q
          --tracing retain-on-failure --screenshot only-on-failure --output e2e-results
          --junitxml=reports/junit-e2e.xml
      - name: Upload e2e reports, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports
          path: |
            reports/
            e2e-results/
          if-no-files-found: ignore
          retention-days: 14

  infra:
    name: Railway IaC (type-check against the SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - name: Install the pinned Railway SDK
        run: npm ci --no-audit --no-fund
      - name: Type-check .railway/railway.ts (unknown options and wrong references fail here)
        run: npm run typecheck
      - name: npm audit (IaC SDK)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Security (pip-audit + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit>=2.7"
      - name: pip-audit (runtime dependencies)
        run: pip-audit -r requirements.txt
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image (build + production smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lpu-reserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Start production-like stack (gunicorn, DEBUG=0, PostgreSQL, Redis, HTTPS proxy)
        run: scripts/ci/stack.sh up
      - name: Smoke test (probes, HTTPS redirect, headers, cookies, static, check --deploy, S3 media, SMTP)
        run: scripts/ci/smoke.sh
      - name: Exactly one Celery Beat (two run_beat containers, leader dies, follower takes over)
        run: scripts/ci/beat_failover.sh
      - name: Backup and restore drill (encrypted pg_dump to S3, restore into a fresh database, compare)
        run: |
          scripts/ci/stack.sh seed >/dev/null
          scripts/ci/backup_roundtrip.sh
      - name: Web container logs
        if: failure()
        run: scripts/ci/stack.sh logs | tail -200

  zap:
    name: OWASP ZAP baseline (production-like stack)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image (from the docker job's layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lpu-reserve:ci
          cache-from: type=gha
      - name: Start production-like stack and load the demo campus
        run: |
          scripts/ci/stack.sh up
          scripts/ci/stack.sh seed
      - name: ZAP baseline (public pages, then a signed-in student session)
        env:
          OUT: zap-out
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
        run: scripts/ci/zap_baseline.sh
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-reports
          path: zap-out/
          if-no-files-found: ignore
          retention-days: 30
      - name: Web container logs
        if: failure()
        run: scripts/ci/stack.sh logs | tail -200

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [lint, tests, e2e, infra, security, docker, zap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deployment target not configured yet
        run: |
          echo "All checks passed on main. Nothing is deployed from this workflow."
          echo "Railway deploys main itself once these checks pass (github source with checkSuites: true in"
          echo ".railway/railway.ts); see docs/deployment-railway.md."
