      - published_by
      - source
      - status
      - term
      - version
    PublicationStatusEnum:
      enum:
      - draft
      - published
      - superseded
      - failed
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `superseded` - Superseded
        * `failed` - Failed
    PublishRequest:
      type: object
      properties:
        term:
          type: string
