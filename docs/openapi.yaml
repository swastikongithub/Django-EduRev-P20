          type: integer
          description: Class occurrences written to the availability ledger
        displaced:
          type: integer
          description: Ordinary bookings cancelled because a class now owns the time
        superseded:
          type: integer
          description: Previously published versions replaced
      required:
      - displaced
      - occurrences
      - publication
      - superseded
