openapi: 3.0.3
info:
  title: LPU Reserve API
  version: 1.0.0
  description: Campus Resource, Laboratory & Facility Booking Platform (EduRev P20).
paths:
  /api/v1/analytics/utilisation/:
    get:
      operationId: analytics_utilisation_retrieve
      summary: Utilisation grouped by type, resource, department or building
      parameters:
      - in: query
        name: by
        schema:
          enum:
          - type
          - resource
          - department
          - building
          type: string
          default: type
          minLength: 1
        description: |-
          * `type` - type
          * `resource` - resource
          * `department` - department
          * `building` - building
      - in: query
        name: department
        schema:
          type: string
          maxLength: 16
          minLength: 1
        description: Department code (campus analysts only; others see their own)
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: 'Last day, inclusive (default: yesterday)'
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: 'First day (default: 30 days ago)'
      - in: query
        name: type
        schema:
          type: string
          maxLength: 40
          minLength: 1
        description: Restrict to one resource type code
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisationReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/approvals/:
    get:
      operationId: approvals_list
      summary: Approval steps I can decide now, soonest booking first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - approvals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalQueueItemList'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: bookings_list
      summary: Bookings visible to me (own, plus resources I manage)
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Bookings starting on/after this date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Bookings starting on/before this date
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only bookings made by or for me
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource
        schema:
          type: number
        description: Resource id
      - in: query
        name: status
        schema:
          type: string
        description: Status(es), comma-separated
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: Atomic claim on the shared ledger. 409 when the time is taken (with
        the reason), 422 when a rule forbids it (hours, quota, blackout, lead time,
        capacity...).
      summary: Book a resource
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/:
    get:
      operationId: bookings_retrieve
      summary: Booking detail
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/approve/:
    post:
      operationId: bookings_approve_create
      summary: Approve the booking's current approval step
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approve'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Approve'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Approve'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/cancel/:
    post:
      operationId: bookings_cancel_create
      summary: Cancel a booking
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cancel'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/check-in/:
    post:
      operationId: bookings_check_in_create
      summary: Check in (from the app, or by the custodian)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckIn'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/check-out/:
    post:
      operationId: bookings_check_out_create
      summary: Check out early and hand the rest of the slot back
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/ics/:
    get:
      operationId: bookings_ics_retrieve
      summary: Download the booking as an iCalendar event
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/calendar:
              schema:
                type: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/bookings/{reference}/reject/:
    post:
      operationId: bookings_reject_create
      summary: Reject the booking's current approval step (a comment is required)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]+$
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reject'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/maintenance/:
    get:
      operationId: maintenance_list
      summary: Maintenance windows on resources I manage
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: resource
        schema:
          type: number
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - in_progress
          - scheduled
        description: |-
          * `scheduled` - Scheduled
          * `in_progress` - In progress
          * `completed` - Completed
          * `cancelled` - Cancelled
      tags:
      - maintenance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaintenanceWindowList'
          description: ''
    post:
      operationId: maintenance_create
      summary: Schedule maintenance (displaces overlapping bookings, whose owners
        are told)
      tags:
      - maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/maintenance/{id}/:
    get:
      operationId: maintenance_retrieve
      summary: Maintenance window detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this maintenance window.
        required: true
      tags:
      - maintenance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
          description: ''
  /api/v1/maintenance/{id}/cancel/:
    post:
      operationId: maintenance_cancel_create
      summary: Cancel a maintenance window (frees its time)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this maintenance window.
        required: true
      tags:
      - maintenance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/maintenance/{id}/complete/:
    post:
      operationId: maintenance_complete_create
      summary: Mark a maintenance window complete (hands unused time back)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this maintenance window.
        required: true
      tags:
      - maintenance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      summary: My profile, capabilities, quota usage and restriction
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      summary: My notifications, newest first
      parameters:
      - in: query
        name: kind
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: unread
        schema:
          type: boolean
        description: Only unread
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      summary: Mark one notification read
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this notification.
        required: true
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      summary: Mark all my notifications read
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllResult'
          description: ''
  /api/v1/resources/:
    get:
      operationId: resources_list
      description: Bookable resources of the caller's institution (retired resources
        are hidden).
      summary: Search and filter resources
      parameters:
      - in: query
        name: building
        schema:
          type: string
        description: Building code, e.g. 34
      - in: query
        name: category
        schema:
          type: string
        description: space, lab, equipment, ...
      - in: query
        name: department
        schema:
          type: string
        description: Owning department code
      - in: query
        name: features
        schema:
          type: string
        description: Comma-separated feature ids or names; the resource must have
          all
      - in: query
        name: free_from
        schema:
          type: string
          format: date-time
        description: 'With free_to: only resources free then'
      - in: query
        name: free_to
        schema:
          type: string
          format: date-time
        description: End of the free window
      - in: query
        name: min_capacity
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Full-text + fuzzy search on name, code, features
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - out_of_service
          - retired
        description: |-
          * `active` - Active
          * `out_of_service` - Out of service
          * `retired` - Retired
      - in: query
        name: type
        schema:
          type: string
        description: Resource type code(s), comma-separated
      tags:
      - catalogue
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResourceList'
          description: ''
  /api/v1/resources/{id_or_slug}/:
    get:
      operationId: resources_retrieve
      description: Bookable resources of the caller's institution (retired resources
        are hidden).
      summary: Resource detail
      parameters:
      - in: path
        name: id_or_slug
        schema:
          type: string
        description: Resource id or slug
        required: true
      tags:
      - catalogue
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetail'
          description: ''
  /api/v1/resources/{id_or_slug}/availability/:
    get:
      operationId: resources_availability_retrieve
      description: Bookable resources of the caller's institution (retired resources
        are hidden).
      summary: Availability grid with a reason for every cell
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: First day (YYYY-MM-DD). Defaults to today.
      - in: query
        name: days
        schema:
          type: integer
          maximum: 7
          minimum: 1
          default: 1
      - in: path
        name: id_or_slug
        schema:
          type: string
        description: Resource id or slug
        required: true
      tags:
      - catalogue
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/resources/{id_or_slug}/report-breakdown/:
    post:
      operationId: resources_report_breakdown_create
      description: Anyone who can see a resource can report it broken; critical reports
        take it offline.
      summary: Report a breakdown
      parameters:
      - in: path
        name: id_or_slug
        schema:
          type: string
        description: Resource id or slug
        required: true
      tags:
      - maintenance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakdownCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BreakdownCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BreakdownCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
  /api/v1/series/:
    post:
      operationId: series_create
      description: Recurring bookings (faculty and staff).
      summary: Create a recurring booking; dates that can't be booked are skipped
        with a reason
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SeriesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SeriesRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
