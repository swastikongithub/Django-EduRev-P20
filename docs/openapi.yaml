    SeriesRequest:
      type: object
      description: Restrict relational inputs to the requesting user's institution.
      properties:
        resource:
          type: integer
        title:
          type: string
          default: ''
          maxLength: 140
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          default: weekly
        interval:
          type: integer
          maximum: 8
          minimum: 1
          default: 1
        weekdays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          description: 0 = Monday ... 6 = Sunday (weekly only; defaults to the start
            date's weekday)
          maxItems: 7
        start_date:
          type: string
          format: date
        until_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        attendees:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
        group_label:
          type: string
          default: ''
          maxLength: 120
        notes:
          type: string
          default: ''
          maxLength: 2000
        booked_for:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
      required:
      - end_time
      - resource
      - start_date
      - start_time
      - until_date
