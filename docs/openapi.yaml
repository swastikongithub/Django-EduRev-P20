        status:
          allOf:
          - $ref: '#/components/schemas/PublicationStatusEnum'
          readOnly: true
        entry_count:
          type: integer
          readOnly: true
        occurrence_count:
          type: integer
          readOnly: true
        displaced_count:
          type: integer
          readOnly: true
