<form method="post" action="{% url 'manage:catalogue' %}" class="stack" style="--gap: var(--s4)" novalidate>{% csrf_token %}
  <input type="hidden" name="action" value="departments.save">{% if form.instance.pk %}<input type="hidden" name="pk" value="{{ form.instance.pk }}">{% endif %}
  {% include "manage/setup/_sheet_errors.html" %}
  <div class="form-grid">
    {% include "manage/setup/_field.html" with f=form.code %}
    {% include "manage/setup/_field.html" with f=form.name %}
    {% include "manage/setup/_field.html" with f=form.school span=1 %}
  </div>
  <div class="row"><button class="btn btn--primary" type="submit">{% icon "check" %}{% if form.instance.pk %}Save department{% else %}Add department{% endif %}</button><button class="btn btn--ghost" type="button" data-close>Cancel</button></div>
</form>
